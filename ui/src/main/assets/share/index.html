<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Findex</title>
<style>
/* Tokens mirror ui/theme/Color.kt and CategoryTones.kt (seed #0D9488). */
:root {
  --primary:#1E6A62; --on-primary:#E2FFF9; --primary-container:#A9F0E5; --on-primary-container:#065C54;
  --secondary-container:#CCE8E3; --on-secondary-container:#3D5653;
  --tertiary-container:#F68C62; --on-tertiary-container:#4F1700;
  --surface:#F6FAF8; --on-surface:#2A3433; --on-surface-variant:#56615F;
  --surface-low:#EEF5F3; --surface-c:#E7F0ED; --surface-high:#E1EAE7; --surface-highest:#D9E5E2; --surface-lowest:#FFFFFF;
  --outline:#727D7B; --outline-variant:#A9B4B1; --error:#A83836; --error-container:#FA746F; --on-error-container:#6E0A12;
  --inverse-surface:#0A0F0E; --inverse-on-surface:#DCE8E5; --scrim:rgba(0,0,0,.5);
  --t-photos:#91F4E6; --o-photos:#005049; --t-videos:#FFDBCE; --o-videos:#753317; --t-audio:#FDD6FF; --o-audio:#62356D;
  --t-documents:#D3E4FF; --o-documents:#0F487C; --t-downloads:#B6F2AF; --o-downloads:#1D511F;
  --t-archives:#FFDDB8; --o-archives:#653E00; --t-apks:#CAEE9B; --o-apks:#334E0D;
  --t-folder:var(--primary-container); --o-folder:var(--on-primary-container); --t-other:var(--surface-highest); --o-other:var(--on-surface-variant);
  --r-xs:4px; --r-s:8px; --r-m:12px; --r-l:16px; --r-xl:28px; --r-full:999px;
  --ease:cubic-bezier(.2,0,0,1); --spring:cubic-bezier(.34,1.36,.64,1);
}
@media (prefers-color-scheme: dark) {
  :root {
    --primary:#9CD1C8; --on-primary:#0F4842; --primary-container:#275B54; --on-primary-container:#B8EEE5;
    --secondary-container:#27403C; --on-secondary-container:#A9C5C0;
    --surface:#0A0F0E; --on-surface:#DCE8E5; --on-surface-variant:#A2ADAB;
    --surface-low:#0F1514; --surface-c:#131B1A; --surface-high:#19211F; --surface-highest:#1E2826; --surface-lowest:#000000;
    --outline:#6D7875; --outline-variant:#3F4A48; --error:#FA746F; --error-container:#871F21; --on-error-container:#FF9993;
    --inverse-surface:#F6FAF8; --inverse-on-surface:#2A3433;
    --t-photos:#005049; --o-photos:#91F4E6; --t-videos:#753317; --o-videos:#FFDBCE; --t-audio:#62356D; --o-audio:#FDD6FF;
    --t-documents:#0F487C; --o-documents:#D3E4FF; --t-downloads:#1D511F; --o-downloads:#B6F2AF;
    --t-archives:#653E00; --o-archives:#FFDDB8; --t-apks:#334E0D; --o-apks:#CAEE9B;
  }
}
* { box-sizing:border-box; }
html, body { margin:0; height:100%; }
body { background:var(--surface); color:var(--on-surface); font:400 14px/20px "Google Sans Flex","Google Sans",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
button { font:inherit; color:inherit; border:0; background:none; cursor:pointer; }
input { font:inherit; color:inherit; }
svg.i { width:24px; height:24px; fill:currentColor; flex:none; }
.hidden { display:none !important; }

/* Shell */
#app { display:flex; height:100vh; height:100dvh; overflow:hidden; }
#drawer { width:300px; flex:none; background:var(--surface-low); padding:12px; overflow-y:auto; display:flex; flex-direction:column; gap:2px; transition:transform .35s var(--ease); }
.brand { display:flex; align-items:center; gap:16px; padding:12px 12px 20px; }
.blob { width:52px; height:52px; display:grid; place-items:center; background:var(--primary-container); color:var(--on-primary-container); border-radius:42% 58% 52% 48% / 48% 44% 56% 52%; }
.brand h1 { margin:0; font-size:24px; line-height:32px; font-weight:600; }
.brand p { margin:0; color:var(--on-surface-variant); }
.nav { display:flex; align-items:center; gap:12px; height:56px; padding:0 16px; border-radius:var(--r-full); color:var(--on-surface-variant); font-weight:500; text-align:left; width:100%; transition:background .2s var(--ease), border-radius .3s var(--spring); }
.nav:hover { background:color-mix(in srgb, var(--on-surface) 8%, transparent); }
.nav.on { background:var(--secondary-container); color:var(--on-secondary-container); }
.nav span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.nav small { color:var(--on-surface-variant); font-weight:400; }
.section { padding:16px 16px 8px; color:var(--on-surface-variant); font-weight:500; font-size:14px; }
.divider { height:1px; background:var(--outline-variant); margin:8px 16px; }
main { flex:1; display:flex; flex-direction:column; min-width:0; }
header { display:flex; align-items:center; gap:8px; padding:12px 16px 8px 24px; min-height:72px; }
header h2 { margin:0; font-size:28px; line-height:36px; font-weight:500; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.icon-btn { width:48px; height:48px; border-radius:var(--r-full); display:grid; place-items:center; color:var(--on-surface-variant); transition:background .2s var(--ease), border-radius .3s var(--spring); }
.icon-btn:hover { background:color-mix(in srgb, var(--on-surface) 8%, transparent); }
.icon-btn:active { border-radius:var(--r-m); }
#menu-btn { display:none; }
.search { display:flex; align-items:center; gap:8px; height:48px; padding:0 16px; border-radius:var(--r-full); background:var(--surface-high); width:min(320px, 40vw); }
.search input { border:0; outline:0; background:none; flex:1; min-width:0; }
#crumbs { display:flex; flex-wrap:wrap; gap:4px; padding:0 24px 8px; }
.crumb { padding:6px 12px; border-radius:var(--r-s); color:var(--on-surface-variant); }
.crumb:hover { background:var(--surface-high); }
.crumb:last-child { color:var(--on-surface); font-weight:500; background:var(--surface-c); }
#content { flex:1; overflow-y:auto; padding:8px 24px 120px; position:relative; }

/* Home */
.drives { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:12px; }
.drive { background:var(--primary-container); color:var(--on-primary-container); border-radius:var(--r-xl); padding:20px; text-align:left; transition:transform .3s var(--spring); }
.drive:hover { transform:scale(1.01); }
.drive .row { display:flex; align-items:center; gap:12px; }
.drive b { font-size:22px; line-height:28px; font-weight:500; flex:1; }
.bar { height:10px; border-radius:var(--r-full); background:color-mix(in srgb, var(--on-primary-container) 18%, transparent); margin:16px 0 8px; overflow:hidden; }
.bar i { display:block; height:100%; background:var(--on-primary-container); border-radius:var(--r-full); }
.h3 { font-size:16px; font-weight:600; margin:28px 4px 12px; }
.cats { display:grid; grid-template-columns:repeat(auto-fill, minmax(168px, 1fr)); gap:12px; }
.cat { border-radius:var(--r-xl); padding:16px; text-align:left; display:flex; flex-direction:column; gap:12px; min-height:132px; transition:transform .3s var(--spring), border-radius .3s var(--spring); }
.cat:hover { transform:translateY(-2px); border-radius:var(--r-l); }
.cat b { font-size:16px; font-weight:600; }
.cat small { opacity:.8; }
.shape { width:44px; height:44px; display:grid; place-items:center; border-radius:var(--r-l); flex:none; }

/* Lists */
.list { display:flex; flex-direction:column; gap:2px; }
.row-item { display:flex; align-items:center; gap:16px; min-height:64px; padding:8px 8px 8px 16px; background:var(--surface-low); border-radius:var(--r-xs); cursor:pointer; position:relative; transition:background .15s var(--ease); }
.row-item:first-child { border-top-left-radius:20px; border-top-right-radius:20px; }
.row-item:last-child { border-bottom-left-radius:20px; border-bottom-right-radius:20px; }
.row-item:hover { background:var(--surface-high); }
.row-item.sel { background:var(--secondary-container); color:var(--on-secondary-container); }
.row-item .meta { flex:1; min-width:0; }
.row-item .name { font-size:16px; line-height:24px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row-item .sub { color:var(--on-surface-variant); font-size:13px; }
.row-item .thumb { width:44px; height:44px; border-radius:var(--r-m); object-fit:cover; flex:none; background:var(--surface-highest); }
.check { width:24px; height:24px; border-radius:var(--r-full); border:2px solid var(--outline); display:grid; place-items:center; flex:none; opacity:0; transition:opacity .15s; color:var(--on-primary); }
.row-item:hover .check, .tile:hover .check, .selecting .check { opacity:1; }
.sel .check { background:var(--primary); border-color:var(--primary); opacity:1; }
.check svg { width:16px; height:16px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:4px; }
.tile { aspect-ratio:1; border-radius:var(--r-m); overflow:hidden; position:relative; background:var(--surface-high); cursor:pointer; transition:border-radius .3s var(--spring), transform .3s var(--spring); }
.tile:hover { border-radius:var(--r-xl); }
.tile img { width:100%; height:100%; object-fit:cover; display:block; }
.tile .check { position:absolute; top:8px; left:8px; background:rgba(0,0,0,.25); border-color:#fff; }
.tile.sel { transform:scale(.92); border-radius:var(--r-xl); }
.tile.sel .check { background:var(--primary); border-color:var(--primary); }
.tile .label { position:absolute; inset:auto 0 0 0; padding:24px 10px 8px; background:linear-gradient(transparent, rgba(0,0,0,.6)); color:#fff; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tile .play { position:absolute; inset:0; display:grid; place-items:center; color:#fff; }
.tile .play svg { width:44px; height:44px; filter:drop-shadow(0 2px 6px rgba(0,0,0,.5)); }
.tile .ico { position:absolute; inset:0; display:grid; place-items:center; }
.tile .ico svg { width:48px; height:48px; }
.empty { text-align:center; padding:80px 16px; color:var(--on-surface-variant); }
.empty .blob { width:96px; height:96px; margin:0 auto 16px; }
.empty .blob svg { width:44px; height:44px; }
.spinner { width:48px; height:48px; margin:80px auto; border-radius:40%; background:var(--primary); animation:morph 1.2s var(--ease) infinite; }
@keyframes morph { 0% { border-radius:40%; transform:rotate(0) scale(.8); } 50% { border-radius:50% 20% 50% 20%; transform:rotate(180deg) scale(1); } 100% { border-radius:40%; transform:rotate(360deg) scale(.8); } }

/* Toolbars, FAB, menus */
#selbar { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:4px; padding:4px 8px; margin:0 0 8px; border-radius:var(--r-full); background:var(--secondary-container); color:var(--on-secondary-container); animation:pop .3s var(--spring); }
#selbar b { flex:1; padding-left:8px; font-size:16px; font-weight:500; }
#selbar .icon-btn { color:inherit; }
@keyframes pop { from { transform:scale(.9); opacity:0; } }
#fabs { position:fixed; right:24px; bottom:24px; display:flex; flex-direction:column; align-items:flex-end; gap:12px; z-index:6; }
.fab { display:flex; align-items:center; gap:12px; height:56px; padding:0 20px; border-radius:var(--r-l); background:var(--primary-container); color:var(--on-primary-container); font-weight:500; font-size:16px; box-shadow:0 3px 8px rgba(0,0,0,.15); transition:border-radius .3s var(--spring), transform .3s var(--spring); }
.fab:hover { border-radius:var(--r-xl); }
.fab.small { height:48px; background:var(--secondary-container); color:var(--on-secondary-container); font-size:14px; }
.menu { position:fixed; z-index:20; min-width:200px; padding:8px 0; border-radius:var(--r-l); background:var(--surface-c); box-shadow:0 4px 16px rgba(0,0,0,.2); animation:pop .2s var(--spring); }
.menu button { display:flex; align-items:center; gap:12px; width:100%; height:48px; padding:0 16px; text-align:left; }
.menu button:hover { background:var(--surface-highest); }
.menu .danger { color:var(--error); }
.dialog-wrap { position:fixed; inset:0; z-index:30; background:var(--scrim); display:grid; place-items:center; padding:16px; animation:fade .2s; }
@keyframes fade { from { opacity:0; } }
.dialog { width:min(400px, 100%); background:var(--surface-high); border-radius:var(--r-xl); padding:24px; animation:pop .3s var(--spring); }
.dialog h3 { margin:0 0 16px; font-size:24px; line-height:32px; font-weight:400; }
.dialog p { color:var(--on-surface-variant); margin:0 0 16px; }
.field { width:100%; height:56px; padding:0 16px; border-radius:var(--r-xs); border:1px solid var(--outline); background:transparent; outline:0; }
.field:focus { border:2px solid var(--primary); padding:0 15px; }
.actions { display:flex; justify-content:flex-end; gap:8px; margin-top:24px; }
.btn { height:40px; padding:0 24px; border-radius:var(--r-full); font-weight:500; transition:border-radius .3s var(--spring); }
.btn:active { border-radius:var(--r-s); }
.btn.text { color:var(--primary); }
.btn.text:hover { background:color-mix(in srgb, var(--primary) 8%, transparent); }
.btn.filled { background:var(--primary); color:var(--on-primary); }
.btn.danger { background:var(--error); color:var(--surface); }
#snack { position:fixed; left:50%; bottom:24px; transform:translate(-50%, 120px); z-index:40; background:var(--inverse-surface); color:var(--inverse-on-surface); padding:14px 20px; border-radius:var(--r-s); max-width:min(560px, calc(100% - 32px)); transition:transform .35s var(--spring); }
#snack.show { transform:translate(-50%, 0); }
#uploads { position:fixed; left:24px; bottom:24px; z-index:7; width:min(360px, calc(100% - 48px)); background:var(--surface-c); border-radius:var(--r-l); box-shadow:0 4px 16px rgba(0,0,0,.2); padding:12px 16px; display:flex; flex-direction:column; gap:10px; max-height:40vh; overflow-y:auto; }
#uploads .u { font-size:13px; }
#uploads .u div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#uploads .bar { margin:6px 0 0; height:4px; background:var(--surface-highest); }
#uploads .bar i { background:var(--primary); transition:width .2s; }
#drop { position:fixed; inset:12px; z-index:25; border:3px dashed var(--primary); border-radius:var(--r-xl); background:color-mix(in srgb, var(--primary-container) 70%, transparent); display:grid; place-items:center; color:var(--on-primary-container); font-size:22px; font-weight:500; pointer-events:none; }

/* Viewer */
#viewer { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.92); display:flex; flex-direction:column; animation:fade .2s; color:#fff; }
#viewer .top { display:flex; align-items:center; gap:8px; padding:8px 16px; }
#viewer .top b { flex:1; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#viewer .icon-btn { color:#fff; }
#viewer .stage { flex:1; display:grid; place-items:center; min-height:0; position:relative; padding:0 64px 24px; }
#viewer img, #viewer video { max-width:100%; max-height:100%; border-radius:var(--r-m); animation:pop .3s var(--spring); }
#viewer audio { width:min(480px, 90%); }
#viewer .nav-arrow { position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,.12); }
#viewer .prev { left:12px; } #viewer .next { right:12px; }

/* Login */
#login { position:fixed; inset:0; display:grid; place-items:center; padding:16px; background:var(--surface); z-index:60; }
.login-card { width:min(420px, 100%); background:var(--surface-c); border-radius:var(--r-xl); padding:32px 24px; text-align:center; }
.login-card .blob { width:72px; height:72px; margin:0 auto 16px; }
.login-card h2 { margin:0 0 8px; font-size:28px; line-height:36px; font-weight:500; }
.login-card p { margin:0 0 24px; color:var(--on-surface-variant); }
.pin { display:flex; justify-content:center; gap:8px; }
.pin input { width:48px; height:60px; text-align:center; font-size:28px; border-radius:var(--r-m); border:1px solid var(--outline); background:var(--surface-lowest); outline:0; caret-color:var(--primary); transition:border-radius .3s var(--spring); }
.pin input:focus { border:2px solid var(--primary); border-radius:var(--r-l); }
.pin input:nth-child(3) { margin-right:12px; }
.login-err { color:var(--error); min-height:20px; margin-top:16px; }
.shake { animation:shake .4s; }
@keyframes shake { 20%,60% { transform:translateX(-8px); } 40%,80% { transform:translateX(8px); } }

@media (max-width: 840px) {
  #drawer { position:fixed; inset:0 auto 0 0; z-index:35; transform:translateX(-100%); box-shadow:0 0 24px rgba(0,0,0,.3); border-radius:0 var(--r-l) var(--r-l) 0; }
  #drawer.open { transform:none; }
  #menu-btn { display:grid; }
  header { padding-left:8px; }
  header h2 { font-size:22px; }
  header { gap:0; }
  header h2 { flex:1 1 0; }
  .search { width:auto; flex:0 1 150px; min-width:0; padding:0 12px; }
  #content { padding:8px 16px 120px; }
  #crumbs { padding:0 16px 8px; }
  .grid { grid-template-columns:repeat(auto-fill, minmax(110px, 1fr)); }
  .fab span { display:none; } .fab { padding:0 16px; }
  #viewer .stage { padding:0 8px 16px; }
}
#scrim { position:fixed; inset:0; background:var(--scrim); z-index:34; }
</style>
</head>

<div id="app" class="hidden">

    inp.value = inp.value.replace(/\D/g, "").slice(-1);

  const wrap = h("div", { class:"dialog-wrap", onclick:(e) => { if (e.target === wrap) wrap.remove(); } });
  const form = h("form", { class:"dialog" }, h("h3", {}, title), body,
    h("div", { class:"actions" }, h("button", { type:"button", class:"btn text", onclick:() => wrap.remove() }, "Cancel"), h("button", { class:"btn " + (danger ? "danger" : "filled") }, okLabel)));
  form.addEventListener("submit", async (e) => { e.preventDefault(); if ((await onOk()) !== false) wrap.remove(); });
  wrap.append(form); document.body.append(wrap);
  const f = form.querySelector("input"); if (f) { f.focus(); const dot = f.value.lastIndexOf("."); f.setSelectionRange(0, dot > 0 ? dot : f.value.length); }
  document.addEventListener("keydown", function esc(ev) { if (ev.key === "Escape") { wrap.remove(); document.removeEventListener("keydown", esc); } });
}
function renameDialog(it) {
  const input = h("input", { class:"field", value:it.name, "aria-label":"Name" });
  dialog("Rename", input, "Rename", () => guard(async () => { await api("/api/rename", { method:"POST", json:{ path:it.path, name:input.value } }); snack("Renamed"); route(); }));
}
function newFolderDialog() {
  const input = h("input", { class:"field", value:"New folder", "aria-label":"Folder name" });
  dialog("New folder", input, "Create", () => guard(async () => { await api("/api/mkdir", { method:"POST", json:{ dir:view.path, name:input.value } }); route(); }));
}
function confirmDelete(paths) {
  dialog(`Delete ${paths.length === 1 ? "this item" : paths.length + " items"}?`, h("p", {}, "They move to the Recycle Bin on the phone and can be restored there."), "Delete",
    () => guard(async () => { await api("/api/delete", { method:"POST", json:{ paths } }); snack(paths.length === 1 ? "Moved to Recycle Bin" : `${paths.length} items moved to Recycle Bin`); route(); }), true);
}

/* ---------- Upload ---------- */
function renderFabs() {
  const f = $("#fabs"); f.replaceChildren();
  const show = view.kind === "dir" && can("UPLOAD");
  f.classList.toggle("hidden", !show);
  if (!show) return;
  f.append(h("button", { class:"fab small", onclick:newFolderDialog }, icon("newfolder"), h("span", {}, "New folder")));
  f.append(h("button", { class:"fab", onclick:() => $("#picker").click() }, icon("upload"), h("span", {}, "Upload")));
}
$("#picker").addEventListener("change", (e) => { uploadFiles([...e.target.files]); e.target.value = ""; });
let dragDepth = 0;
const canDrop = () => view.kind === "dir" && can("UPLOAD");
document.addEventListener("dragenter", (e) => { if (!canDrop() || !e.dataTransfer.types.includes("Files")) return; e.preventDefault(); if (dragDepth++ === 0) document.body.append(h("div", { id:"drop" }, "Drop files to upload here")); });
document.addEventListener("dragover", (e) => { if (canDrop()) e.preventDefault(); });
document.addEventListener("dragleave", () => { if (dragDepth && --dragDepth === 0) $("#drop")?.remove(); });
document.addEventListener("drop", (e) => {
  if (!canDrop()) return; e.preventDefault(); dragDepth = 0; $("#drop")?.remove();
  uploadFiles([...e.dataTransfer.files]);
});
const queue = [];
let uploading = false;
function uploadFiles(files) {
  if (!files.length) return;
  const panel = $("#uploads"); panel.classList.remove("hidden");
  for (const file of files) {
    const bar = h("i", { style:"width:0" });
    const label = h("div", {}, file.name);
    const el = h("div", { class:"u" }, label, h("div", { class:"bar" }, bar));
    panel.append(el);
    queue.push({ file, dir:view.path, bar, label, el });
  }
  if (!uploading) pump();
}
async function pump() {
  uploading = true;
  let done = 0, failed = 0;
  while (queue.length) {
    const job = queue.shift();
    const ok = await new Promise((resolve) => {
      const x = new XMLHttpRequest();
      x.open("PUT", `/api/upload?dir=${enc(job.dir)}&name=${enc(job.file.name)}`);
      x.setRequestHeader("X-Findex", "1");
      x.upload.onprogress = (e) => { if (e.lengthComputable) job.bar.style.width = (e.loaded / e.total * 100) + "%"; };
      x.onload = () => {
        if (x.status === 401) showLogin();
        let code; try { code = JSON.parse(x.responseText).error; } catch (_) {}
        if (x.status !== 200) job.label.textContent = `${job.file.name} — ${ERRORS[code] || "failed"}`;
        resolve(x.status === 200);
      };
      x.onerror = () => { job.label.textContent = `${job.file.name} — failed`; resolve(false); };
      x.send(job.file);
    });
    ok ? done++ : failed++;
    if (ok) setTimeout(() => job.el.remove(), 1500);
    if (ok && view.kind === "dir" && view.path === job.dir) route();
  }
  uploading = false;
  snack(failed ? `${done} uploaded, ${failed} failed` : `${done} file${done === 1 ? "" : "s"} uploaded`);
  setTimeout(() => { if (!uploading) { $("#uploads").replaceChildren(); $("#uploads").classList.add("hidden"); } }, failed ? 8000 : 1700);
}

/* ---------- Viewer ---------- */
function openFile(it, list) {
  if (!can("DOWNLOAD")) return snack(ERRORS.denied);
  const k = kindOf(it);
  if (k !== "photos" && k !== "videos" && k !== "audio") { window.open(fileUrl(it.path), "_blank", "noopener"); return; }
  const media = list.filter((i) => ["photos", "videos", "audio"].includes(kindOf(i)));
  let idx = media.findIndex((i) => i.path === it.path);
  const stage = h("div", { class:"stage" });
  const name = h("b", {});
  const v = h("div", { id:"viewer" },
    h("div", { class:"top" },
      h("button", { class:"icon-btn", title:"Close", onclick:close }, icon("close")), name,
      h("button", { class:"icon-btn", title:"Download", onclick:() => download(media[idx]) }, icon("download"))),
    stage);
  const prev = h("button", { class:"icon-btn nav-arrow prev", title:"Previous", onclick:() => show(idx - 1) }, icon("left"));
  const next = h("button", { class:"icon-btn nav-arrow next", title:"Next", onclick:() => show(idx + 1) }, icon("right"));
  function show(i) {
    if (i < 0 || i >= media.length) return;
    idx = i; const cur = media[i]; const ck = kindOf(cur);
    name.textContent = cur.name;
    const src = fileUrl(cur.path);
    const el = ck === "photos" ? h("img", { src, alt:cur.name }) : ck === "videos" ? h("video", { src, controls:true, autoplay:true }) : h("audio", { src, controls:true, autoplay:true });
    stage.replaceChildren(el, i > 0 ? prev : "", i < media.length - 1 ? next : "");
  }
  function key(e) { if (e.key === "Escape") close(); else if (e.key === "ArrowLeft") show(idx - 1); else if (e.key === "ArrowRight") show(idx + 1); }
  function close() { v.remove(); document.removeEventListener("keydown", key); }
  document.addEventListener("keydown", key);
  document.body.append(v); show(idx);
}

/* ---------- Boot ---------- */
async function start() {
  try { await loadInfo(); } catch (e) { return; }
  $("#app").classList.remove("hidden");
  route();
}
start();
</script>
